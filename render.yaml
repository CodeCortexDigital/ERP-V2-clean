# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then "New Blueprint" → select this repo.
# This provisions the backend stack (Postgres, Redis/KeyValue, Django web).
# The frontend SPA is deployed separately on Vercel (free) — see README.
#
# Note: on the free plan, Render does not allow a preDeployCommand (migrations
# run in the web start command instead) and background workers are not
# available (Celery worker/beat are omitted; scheduled tasks are skipped).

databases:
  - name: erp-db
    databaseName: erp_db
    user: erp_user
    plan: free

services:
  - type: keyvalue
    name: erp-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: erp-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py create_admin && daphne -b 0.0.0.0 -p $PORT erp_core.asgi:application
    healthCheckPath: /api/v1/health/
    autoDeployTrigger: checksPass  # deploy only after the GitHub CI checks pass (P5)
    envVars:
      - key: FIREBASE_PROJECT_ID  # enables 'Continue with Google' (school signup/sign-in)
        value: school-erp-c53b4
      - key: DJANGO_SETTINGS_MODULE
        value: erp_core.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DB_HOST
        fromDatabase:
          name: erp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: erp-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: erp-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: erp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: erp-db
          property: password
      - key: REDIS_URL
        fromService:
          name: erp-redis
          type: keyvalue
          property: connectionString
      - key: CACHE_URL
        fromService:
          name: erp-redis
          type: keyvalue
          property: connectionString
      - key: CHANNEL_REDIS_URL
        fromService:
          name: erp-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: erp-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: erp-redis
          type: keyvalue
          property: connectionString
      # AI assistant - set keys in the Render dashboard (docs/AI_UPGRADE_TODO.md)
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # App addresses (Microsoft sign-in, Google Classroom and email links). Set in the Render dashboard:
      # FRONTEND_ORIGINS = the web app URL(s), comma-separated; PUBLIC_API_URL = this backend's https URL.
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # Outgoing email (reminders, notices). Any SMTP service: Google Workspace, SendGrid, Mailgun...
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Optional: one Google Classroom app shared by every school (otherwise each school enters its own).
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Platform billing (P12): card payment of school subscription invoices, and what invoices show.
      - key: PLATFORM_STRIPE_SECRET_KEY
        sync: false
      - key: PLATFORM_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_BANK_DETAILS
        sync: false
      - key: PLATFORM_LEGAL_NAME
        sync: false
      - key: PLATFORM_ADDRESS
        sync: false
      - key: PLATFORM_TAX_ID
        sync: false
      - key: ERROR_ALERT_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SECRET_KEY_FALLBACKS  # old SECRET_KEY during a key change (docs/KEY_ROTATION.md)
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY_FALLBACKS
        sync: false
