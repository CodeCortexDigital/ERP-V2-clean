name: CI

# Runs on every push and pull request (P5). Render deploys main only after these checks pass
# (render.yaml: autoDeployTrigger: checksPass), so a broken commit never reaches the live site.
# "Postgres (report)" also runs the tests on Postgres like production, but only reports: it does not block.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      USE_SQLITE: '1'
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest tests -q -n auto --no-cov -p no:cacheprovider

  deploy-settings:
    name: Production settings and migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz
      ALLOWED_HOSTS: example.com
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: erp_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      # The same steps as the Render start command, on an empty Postgres: a migration that fails here would stop the deploy.
      - name: Settings load with DEBUG off
        run: |
          set -o pipefail
          python manage.py check --deploy --fail-level ERROR 2>&1 | grep -v drf_spectacular
      - name: Migrations apply on Postgres
        run: python manage.py migrate --noinput
      - name: Static files collect
        run: python manage.py collectstatic --noinput -v 0

  postgres-tests:
    name: Postgres (report)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: '1'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: erp_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests -q -n auto --no-cov -p no:cacheprovider

  frontend:
    name: Frontend type check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
