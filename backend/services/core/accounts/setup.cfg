[metadata]
name = accounts-service
version = 1.0.0
description = Accounts and authentication microservice
long_description = file: README.md
long_description_content_type = text/markdown
url = http://accounts-service.core.internal
author = Core Team
author_email = core@erp.internal
license = Proprietary
license_file = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.0
    Intended Audience :: System Administrators
    License :: Other/Proprietary License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Topic :: Internet :: WWW/HTTP
    Topic :: Security
    Topic :: System :: Systems Administration

[options]
packages = find:
python_requires = >=3.12
install_requires =
    Django>=5.2.0
    djangorestframework>=3.16.0
    psycopg2-binary>=2.9.0
    python-dotenv>=1.0.0
    django-environ>=0.13.0
    redis>=7.2.0
    django-redis>=6.0.0
    PyJWT>=2.11.0
    cryptography>=44.0.0
    django-cors-headers>=4.9.0
    requests>=2.32.0
    django-filter>=25.2.0
    celery>=5.6.0
    django-prometheus>=2.4.0
    django-health-check>=4.1.0
    sentry-sdk>=2.53.0
    drf-yasg>=1.21.0
    django-storages>=1.14.0
    boto3>=1.42.0
    Pillow>=11.2.0
    gunicorn>=23.0.0
    passlib>=1.7.4
    bcrypt>=4.3.0
    django-otp>=1.5.4
    qrcode>=8.0

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    docs.*
    scripts
    scripts.*
    accounts.tests
    accounts.tests.*
    accounts.migrations
    accounts.migrations.*

[options.extras_require]
dev =
    pytest>=8.3.0
    pytest-django>=4.11.0
    pytest-cov>=6.1.0
    factory-boy>=3.3.0
    Faker>=37.1.0
    black>=24.2.0
    isort>=5.13.0
    flake8>=7.0.0
    mypy>=1.8.0
    bandit>=1.7.7
    pre-commit>=3.6.0
    ipython>=9.2.0
    django-extensions>=3.2.0
    django-debug-toolbar>=4.3.0

production =
    gunicorn>=23.0.0
    uvicorn>=0.34.0
    sentry-sdk>=2.53.0

[flake8]
max-line-length = 100
extend-ignore = E203,W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    migrations,
    venv,
    *.pyc,
    *.egg-info,
    .tox,
    .venv,
    accounts/migrations

[pycodestyle]
max-line-length = 100
exclude = migrations,venv,.venv

[coverage:run]
source = accounts
omit =
    */tests/*
    */migrations/*
    */management/*
    */__init__.py
    */apps.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

[mypy.plugins.django-stubs]
django_settings_module = accounts_project.settings

[bandit]
exclude = /venv/,/migrations/,/tests/,accounts_project/
skips = B101,B311,B403
